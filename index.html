<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>API Lookup Tool</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Segoe UI', Tahoma, sans-serif;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    min-height: 100vh;
    padding: 20px;
    color: #333;
  }
  .container {
    max-width: 900px;
    margin: 0 auto;
    background: #fff;
    border-radius: 12px;
    box-shadow: 0 10px 40px rgba(0,0,0,0.2);
    overflow: hidden;
  }
  header {
    background: #1a202c;
    color: #fff;
    padding: 20px;
    text-align: center;
  }
  header h1 { font-size: 22px; }
  header p { font-size: 13px; opacity: 0.8; margin-top: 4px; }

  .tabs {
    display: flex;
    background: #2d3748;
  }
  .tab {
    flex: 1;
    padding: 14px;
    text-align: center;
    color: #cbd5e0;
    cursor: pointer;
    font-size: 14px;
    font-weight: 600;
    border-bottom: 3px solid transparent;
    transition: 0.2s;
  }
  .tab:hover { background: #4a5568; color: #fff; }
  .tab.active {
    background: #fff;
    color: #667eea;
    border-bottom-color: #667eea;
  }

  .panel { padding: 24px; display: none; }
  .panel.active { display: block; }

  label {
    display: block;
    font-size: 13px;
    font-weight: 600;
    margin-bottom: 6px;
    color: #4a5568;
  }
  input, select {
    width: 100%;
    padding: 11px 14px;
    border: 1px solid #cbd5e0;
    border-radius: 8px;
    font-size: 15px;
    margin-bottom: 14px;
    outline: none;
    transition: 0.2s;
  }
  input:focus, select:focus {
    border-color: #667eea;
    box-shadow: 0 0 0 3px rgba(102,126,234,0.15);
  }
  button {
    width: 100%;
    padding: 13px;
    background: linear-gradient(135deg, #667eea, #764ba2);
    color: #fff;
    border: none;
    border-radius: 8px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    transition: 0.2s;
  }
  button:hover { opacity: 0.9; transform: translateY(-1px); }
  button:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }

  .result {
    margin-top: 20px;
    background: #1a202c;
    color: #68d391;
    padding: 16px;
    border-radius: 8px;
    font-family: 'Courier New', monospace;
    font-size: 13px;
    white-space: pre-wrap;
    word-break: break-word;
    max-height: 500px;
    overflow: auto;
    display: none;
  }
  .result.show { display: block; }
  .result.error { color: #fc8181; }
  .loader {
    display: none;
    text-align: center;
    margin-top: 16px;
    color: #667eea;
    font-weight: 600;
  }
  .loader.show { display: block; }

  /* Simple formatted table for results */
  .data-table {
    width: 100%;
    border-collapse: collapse;
    margin-top: 10px;
    font-family: 'Segoe UI', sans-serif;
    font-size: 13px;
  }
  .data-table td {
    padding: 8px 12px;
    border-bottom: 1px solid #2d3748;
    color: #e2e8f0;
  }
  .data-table td:first-child {
    color: #90cdf4;
    font-weight: 600;
    width: 40%;
  }
</style>
</head>
<body>

<div class="container">
  <header>
    <h1>🔍 API Lookup Tool</h1>
    <p>Number Info • Vehicle Info • Aadhaar Info</p>
  </header>

  <div class="tabs">
    <div class="tab active" data-tab="num">📱 Number Info</div>
    <div class="tab" data-tab="vehicle">🚗 Vehicle Info</div>
    <div class="tab" data-tab="aadhaar">🆔 Aadhaar Info</div>
  </div>

  <!-- NUMBER INFO -->
  <div class="panel active" id="panel-num">
    <label>Mobile Number</label>
    <input type="text" id="num-input" placeholder="e.g. 9162516577" maxlength="12">
    <button onclick="fetchNumberInfo()">Get Number Info</button>
    <div class="loader" id="loader-num">⏳ Fetching data...</div>
    <div class="result" id="result-num"></div>
  </div>

  <!-- VEHICLE INFO -->
  <div class="panel" id="panel-vehicle">
    <label>Vehicle Registration Number</label>
    <input type="text" id="vehicle-input" placeholder="e.g. HR55AL0051" style="text-transform:uppercase">
    <button onclick="fetchVehicleInfo()">Get Vehicle Info</button>
    <div class="loader" id="loader-vehicle">⏳ Fetching data...</div>
    <div class="result" id="result-vehicle"></div>
  </div>

  <!-- AADHAAR INFO -->
  <div class="panel" id="panel-aadhaar">
    <label>Aadhaar Number (12 digits)</label>
    <input type="text" id="aadhaar-input" placeholder="e.g. 677531893455" maxlength="12">
    <button onclick="fetchAadhaarInfo()">Get Aadhaar Info</button>
    <div class="loader" id="loader-aadhaar">⏳ Fetching data...</div>
    <div class="result" id="result-aadhaar"></div>
  </div>
</div>

<script>
// ============ TAB SWITCHING ============
document.querySelectorAll('.tab').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
    tab.classList.add('active');
    document.getElementById('panel-' + tab.dataset.tab).classList.add('active');
  });
});

// ============ CONFIG ============
// NOTE: API key ko production mein server-side rakhna chahiye.
// Yahan demo ke liye rakh rahe hain.
const API_BASE = 'https://api.sarkariallupdates.com/api';
const API_KEY  = '30day';

// ============ HELPERS ============
function showLoader(id, show) {
  document.getElementById(id).classList.toggle('show', show);
}
function showResult(id, data, isError) {
  const el = document.getElementById(id);
  el.classList.add('show');
  el.classList.toggle('error', !!isError);

  if (typeof data === 'object' && data !== null) {
    // Pretty JSON
    el.textContent = JSON.stringify(data, null, 2);
  } else {
    el.textContent = data;
  }
}

// Generic fetch with error handling
async function callApi(url) {
  const res = await fetch(url);
  if (!res.ok) throw new Error('HTTP ' + res.status);
  const text = await res.text();
  try { return JSON.parse(text); }
  catch { return text; }
}

// ============ 1. NUMBER INFO ============
async function fetchNumberInfo() {
  const num = document.getElementById('num-input').value.trim();
  if (!/^\d{10,12}$/.test(num)) {
    return showResult('result-num', '❌ Valid 10-12 digit mobile number daaliye.', true);
  }
  showLoader('loader-num', true);
  try {
    const url = `${API_BASE}?=num_info&key=${API_KEY}&num=${encodeURIComponent(num)}`;
    const data = await callApi(url);
    showResult('result-num', data);
  } catch (e) {
    showResult('result-num', '❌ Error: ' + e.message, true);
  } finally {
    showLoader('loader-num', false);
  }
}

// ============ 2. VEHICLE INFO ============
async function fetchVehicleInfo() {
  const xr = document.getElementById('vehicle-input').value.trim().toUpperCase();
  if (!/^[A-Z]{2}\d{1,2}[A-Z]{1,3}\d{4}$/.test(xr)) {
    return showResult('result-vehicle', '❌ Valid vehicle number daaliye (e.g. HR55AL0051).', true);
  }
  showLoader('loader-vehicle', true);
  try {
    const url = `${API_BASE}?=ultra_vehicle&key=demo&xr=${encodeURIComponent(xr)}`;
    const data = await callApi(url);
    showResult('result-vehicle', data);
  } catch (e) {
    showResult('result-vehicle', '❌ Error: ' + e.message, true);
  } finally {
    showLoader('loader-vehicle', false);
  }
}

// ============ 3. AADHAAR INFO ============
async function fetchAadhaarInfo() {
  const q = document.getElementById('aadhaar-input').value.trim();
  if (!/^\d{12}$/.test(q)) {
    return showResult('result-aadhaar', '❌ Valid 12-digit Aadhaar number daaliye.', true);
  }
  showLoader('loader-aadhaar', true);
  try {
    const url = `${API_BASE}?=addhaar2num&key=${API_KEY}&q=${encodeURIComponent(q)}`;
    const data = await callApi(url);
    showResult('result-aadhaar', data);
  } catch (e) {
    showResult('result-aadhaar', '❌ Error: ' + e.message, true);
  } finally {
    showLoader('loader-aadhaar', false);
  }
}

// Enter key support
document.getElementById('num-input').addEventListener('keydown', e => e.key === 'Enter' && fetchNumberInfo());
document.getElementById('vehicle-input').addEventListener('keydown', e => e.key === 'Enter' && fetchVehicleInfo());
document.getElementById('aadhaar-input').addEventListener('keydown', e => e.key === 'Enter' && fetchAadhaarInfo());
</script>

</body>
</html>
