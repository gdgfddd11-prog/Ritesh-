<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>API Tools - Num Info | Vehicle Info | Aadhaar Info</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }

  body {
    background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
    min-height: 100vh;
    color: #fff;
    padding: 20px;
  }

  .container {
    max-width: 900px;
    margin: 0 auto;
  }

  header {
    text-align: center;
    margin-bottom: 30px;
  }

  header h1 {
    font-size: 2rem;
    background: linear-gradient(90deg, #00c6ff, #0072ff);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    margin-bottom: 8px;
  }

  header p { color: #aaa; font-size: 0.9rem; }

  /* Tabs */
  .tabs {
    display: flex;
    gap: 10px;
    margin-bottom: 20px;
    flex-wrap: wrap;
  }

  .tab-btn {
    flex: 1;
    padding: 12px;
    border: none;
    border-radius: 10px;
    background: rgba(255,255,255,0.08);
    color: #ccc;
    cursor: pointer;
    font-weight: 600;
    transition: 0.3s;
    min-width: 120px;
  }

  .tab-btn:hover { background: rgba(255,255,255,0.15); }

  .tab-btn.active {
    background: linear-gradient(90deg, #00c6ff, #0072ff);
    color: #fff;
    box-shadow: 0 4px 15px rgba(0,114,255,0.4);
  }

  /* Card */
  .card {
    background: rgba(255,255,255,0.07);
    backdrop-filter: blur(10px);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 16px;
    padding: 24px;
    margin-bottom: 20px;
  }

  .tab-content { display: none; }
  .tab-content.active { display: block; }

  label {
    display: block;
    margin-bottom: 8px;
    font-size: 0.9rem;
    color: #bbb;
  }

  input {
    width: 100%;
    padding: 12px 14px;
    border-radius: 10px;
    border: 1px solid rgba(255,255,255,0.15);
    background: rgba(0,0,0,0.3);
    color: #fff;
    font-size: 1rem;
    outline: none;
    margin-bottom: 14px;
  }

  input:focus { border-color: #00c6ff; }

  .btn {
    width: 100%;
    padding: 13px;
    border: none;
    border-radius: 10px;
    background: linear-gradient(90deg, #00c6ff, #0072ff);
    color: #fff;
    font-weight: 700;
    font-size: 1rem;
    cursor: pointer;
    transition: 0.3s;
  }

  .btn:hover { opacity: 0.9; transform: translateY(-1px); }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; }

  /* Result */
  .result {
    margin-top: 20px;
    background: rgba(0,0,0,0.35);
    border-radius: 12px;
    padding: 18px;
    display: none;
    max-height: 500px;
    overflow-y: auto;
  }

  .result.show { display: block; }

  .result h3 {
    margin-bottom: 12px;
    color: #00c6ff;
    font-size: 1rem;
    border-bottom: 1px solid rgba(255,255,255,0.1);
    padding-bottom: 8px;
  }

  .data-row {
    display: flex;
    justify-content: space-between;
    padding: 8px 0;
    border-bottom: 1px dashed rgba(255,255,255,0.08);
    font-size: 0.9rem;
    gap: 10px;
  }

  .data-row:last-child { border-bottom: none; }

  .data-row .key { color: #888; text-transform: capitalize; }
  .data-row .val { color: #fff; text-align: right; word-break: break-word; }

  .loader {
    text-align: center;
    padding: 20px;
    color: #00c6ff;
  }

  .spinner {
    width: 32px; height: 32px;
    border: 3px solid rgba(0,198,255,0.2);
    border-top-color: #00c6ff;
    border-radius: 50%;
    margin: 0 auto 10px;
    animation: spin 0.8s linear infinite;
  }

  @keyframes spin { to { transform: rotate(360deg); } }

  .error {
    color: #ff6b6b;
    background: rgba(255,107,107,0.1);
    border: 1px solid rgba(255,107,107,0.3);
    padding: 12px;
    border-radius: 8px;
    font-size: 0.9rem;
  }

  footer {
    text-align: center;
    color: #666;
    font-size: 0.8rem;
    margin-top: 30px;
  }

  @media (max-width: 480px) {
    header h1 { font-size: 1.4rem; }
    .tab-btn { font-size: 0.8rem; padding: 10px 6px; }
  }
</style>
</head>
<body>

<div class="container">
  <header>
    <h1>🚀 API Tools</h1>
    <p>Number Info • Vehicle Full Info • Aadhaar Info</p>
  </header>

  <div class="tabs">
    <button class="tab-btn active" data-tab="num">📞 Num Info</button>
    <button class="tab-btn" data-tab="vehicle">🚗 Vehicle Info</button>
    <button class="tab-btn" data-tab="aadhaar">🆔 Aadhaar Info</button>
  </div>

  <!-- TAB 1: NUM INFO -->
  <div id="num" class="tab-content active">
    <div class="card">
      <label>Mobile Number (10 digit)</label>
      <input type="text" id="numInput" placeholder="e.g. 9162516577" maxlength="10" />
      <button class="btn" onclick="getNumInfo()">🔍 Get Info</button>
      <div class="result" id="numResult"></div>
    </div>
  </div>

  <!-- TAB 2: VEHICLE INFO -->
  <div id="vehicle" class="tab-content">
    <div class="card">
      <label>Vehicle Registration Number</label>
      <input type="text" id="vehInput" placeholder="e.g. HR55AL0051" />
      <button class="btn" onclick="getVehicleInfo()">🔍 Get Vehicle Info</button>
      <div class="result" id="vehResult"></div>
    </div>
  </div>

  <!-- TAB 3: AADHAAR INFO -->
  <div id="aadhaar" class="tab-content">
    <div class="card">
      <label>Aadhaar Number (12 digit)</label>
      <input type="text" id="aadInput" placeholder="e.g. 677531893455" maxlength="12" />
      <button class="btn" onclick="getAadhaarInfo()">🔍 Get Aadhaar Info</button>
      <div class="result" id="aadResult"></div>
    </div>
  </div>

  <footer>© 2024 API Tools. All rights reserved.</footer>
</div>

<script>
/* ================= TAB SWITCHING ================= */
const tabs = document.querySelectorAll('.tab-btn');
const contents = document.querySelectorAll('.tab-content');

tabs.forEach(btn => {
  btn.addEventListener('click', () => {
    tabs.forEach(b => b.classList.remove('active'));
    contents.forEach(c => c.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById(btn.dataset.tab).classList.add('active');
  });
});

/* ================= HELPERS ================= */
function showLoader(el) {
  el.className = 'result show';
  el.innerHTML = '<div class="loader"><div class="spinner"></div>Fetching data...</div>';
}

function showError(el, msg) {
  el.className = 'result show';
  el.innerHTML = `<div class="error">❌ ${msg}</div>`;
}

// Recursive renderer for nested objects
function renderData(obj, title = 'Result') {
  let html = `<h3>✅ ${title}</h3>`;
  html += renderObject(obj);
  return html;
}

function renderObject(obj) {
  let html = '';
  for (const [k, v] of Object.entries(obj)) {
    if (v === null || v === undefined) continue;
    if (typeof v === 'object') {
      html += `<div class="data-row"><span class="key">${formatKey(k)}</span></div>`;
      html += `<div style="padding-left:15px;">${renderObject(v)}</div>`;
    } else {
      html += `<div class="data-row">
        <span class="key">${formatKey(k)}</span>
        <span class="val">${v}</span>
      </div>`;
    }
  }
  return html;
}

function formatKey(k) {
  return k.replace(/_/g, ' ').replace(/\b\w/g, c => c.toUpperCase());
}

/* ================= API 1: NUM INFO ================= */
async function getNumInfo() {
  const num = document.getElementById('numInput').value.trim();
  const res = document.getElementById('numResult');
  if (!num || num.length < 10) return showError(res, 'Valid 10-digit number daalein.');

  showLoader(res);
  try {
    const url = `https://api.sarkariallupdates.com/api?=num_info&key=30day&num=${num}`;
    const r = await fetch(url);
    const data = await r.json();
    res.innerHTML = renderData(data, 'Number Info');
  } catch (e) {
    showError(res, 'API Error: ' + e.message);
  }
}

/* ================= API 2: VEHICLE INFO ================= */
async function getVehicleInfo() {
  const veh = document.getElementById('vehInput').value.trim().toUpperCase();
  const res = document.getElementById('vehResult');
  if (!veh) return showError(res, 'Vehicle number daalein.');

  showLoader(res);
  try {
    const url = `https://api.sarkariallupdates.com/api?=ultra_vehicle&key=demo&xr=${veh}`;
    const r = await fetch(url);
    const data = await r.json();
    res.innerHTML = renderData(data, 'Vehicle Full Info');
  } catch (e) {
    showError(res, 'API Error: ' + e.message);
  }
}

/* ================= API 3: AADHAAR INFO ================= */
async function getAadhaarInfo() {
  const aad = document.getElementById('aadInput').value.trim();
  const res = document.getElementById('aadResult');
  if (!aad || aad.length !== 12) return showError(res, 'Valid 12-digit Aadhaar number daalein.');

  showLoader(res);
  try {
    const url = `https://api.sarkariallupdates.com/api?=addhaar2num&key=30day&q=${aad}`;
    const r = await fetch(url);
    const data = await r.json();
    res.innerHTML = renderData(data, 'Aadhaar Info');
  } catch (e) {
    showError(res, 'API Error: ' + e.message);
  }
}
</script>

</body>
</html>
