<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sarkari API Tool</title>
<style>
  * { box-sizing: border-box; }
  body { font-family: system-ui, sans-serif; max-width: 720px; margin: 1rem auto; padding: 0 1rem; background: #f7f9fc; color: #222; }
  h1 { text-align: center; color: #0066cc; }
  .card { background: #fff; border-radius: 10px; padding: 1rem; margin-bottom: 1rem; box-shadow: 0 2px 6px rgba(0,0,0,0.08); }
  .card h3 { margin-top: 0; color: #0066cc; }
  input, button { width: 100%; padding: 0.6rem; margin: 0.3rem 0; border-radius: 6px; border: 1px solid #ccc; font-size: 1rem; }
  button { background: #007bff; color: #fff; border: none; cursor: pointer; font-weight: 600; }
  button:hover { background: #0056b3; }
  .btn-green { background: #28a745; }
  .btn-green:hover { background: #1e7e34; }
  .btn-red { background: #dc3545; }
  .btn-red:hover { background: #a71d2a; }
  .hidden { display: none; }
  .error { color: #dc3545; font-size: 0.9rem; }
  .success { color: #28a745; font-size: 0.9rem; }
  #result, #logsOutput { background: #f0f2f5; padding: 1rem; border-radius: 6px; white-space: pre-wrap; word-break: break-all; font-size: 0.85rem; max-height: 400px; overflow: auto; }
  .row { display: flex; gap: 0.5rem; }
  .row button { flex: 1; }
</style>
</head>
<body>
<h1>🔍 Sarkari API Tool</h1>

<div id="auth-section">
  <div class="card">
    <h3>Login / Register</h3>
    <input type="email" id="email" placeholder="Email">
    <input type="password" id="password" placeholder="Password">
    <div class="row">
      <button onclick="login()">Login</button>
      <button class="btn-green" onclick="register()">Register</button>
    </div>
    <p id="auth-msg" class="error"></p>
  </div>
</div>

<div id="main-section" class="hidden">
  <div class="card">
    <h3>📱 Number Info</h3>
    <input type="text" id="numInput" placeholder="Mobile Number e.g. 9162516577">
    <button onclick="callApi('num-info', document.getElementById('numInput').value)">Check Number</button>
  </div>

  <div class="card">
    <h3>🚗 Vehicle Info</h3>
    <input type="text" id="vehInput" placeholder="Registration e.g. HR55AL0051">
    <button onclick="callApi('vehicle-info', document.getElementById('vehInput').value)">Check Vehicle</button>
  </div>

  <div class="card">
    <h3>🆔 Aadhaar Info</h3>
    <input type="text" id="aadhaarInput" placeholder="Aadhaar Number">
    <button onclick="callApi('aadhaar-info', document.getElementById('aadhaarInput').value)">Check Aadhaar</button>
  </div>

  <div class="card">
    <h3>📄 Result</h3>
    <pre id="result">Yahan result aayega...</pre>
  </div>

  <div class="card hidden" id="admin-panel">
    <h3>🛡️ Admin Panel</h3>
    <div class="row">
      <button onclick="loadLogs()">API Logs</button>
      <button onclick="loadUsers()">Users</button>
    </div>
    <pre id="logsOutput"></pre>
  </div>

  <button class="btn-red" onclick="logout()">Logout</button>
</div>

<script>
const BACKEND_URL = 'https://aapka-backend.onrender.com';
let token = localStorage.getItem('token');

function checkAuth() {
  if (token) {
    document.getElementById('auth-section').classList.add('hidden');
    document.getElementById('main-section').classList.remove('hidden');
    try {
      const payload = JSON.parse(atob(token.split('.')[1]));
      if (payload.role === 'admin') {
        document.getElementById('admin-panel').classList.remove('hidden');
      }
    } catch(e) {}
  } else {
    document.getElementById('auth-section').classList.remove('hidden');
    document.getElementById('main-section').classList.add('hidden');
  }
}

async function login() {
  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;
  const msg = document.getElementById('auth-msg');
  if (!email || !password) return msg.innerText = 'Email & password daalein';
  try {
    const res = await fetch(`${BACKEND_URL}/api/login`, {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({email, password})
    });
    const data = await res.json();
    if (res.ok) {
      localStorage.setItem('token', data.token);
      token = data.token;
      msg.innerText = '';
      checkAuth();
    } else {
      msg.innerText = data.error;
    }
  } catch(e) { msg.innerText = 'Network error: ' + e.message; }
}

async function register() {
  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;
  const msg = document.getElementById('auth-msg');
  if (!email || !password) return msg.innerText = 'Email & password daalein';
  if (password.length < 6) return msg.innerText = 'Password kam se kam 6 char ka ho';
  try {
    const res = await fetch(`${BACKEND_URL}/api/register`, {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({email, password})
    });
    const data = await res.json();
    if (res.ok) {
      msg.className = 'success';
      msg.innerText = 'Register ho gaya! Ab Login karein.';
    } else {
      msg.className = 'error';
      msg.innerText = data.error;
    }
  } catch(e) { msg.innerText = 'Network error: ' + e.message; }
}

async function callApi(type, value) {
  if (!value) return alert('Value daalein');
  document.getElementById('result').innerText = 'Loading...';
  try {
    const res = await fetch(`${BACKEND_URL}/api/${type}/${encodeURIComponent(value)}`, {
      headers: {'Authorization': `Bearer ${token}`}
    });
    const data = await res.json();
    document.getElementById('result').innerText = JSON.stringify(data, null, 2);
  } catch(e) {
    document.getElementById('result').innerText = 'Error: ' + e.message;
  }
}

async function loadLogs() {
  const res = await fetch(`${BACKEND_URL}/api/admin/logs`, {
    headers: {'Authorization': `Bearer ${token}`}
  });
  document.getElementById('logsOutput').innerText = JSON.stringify(await res.json(), null, 2);
}

async function loadUsers() {
  const res = await fetch(`${BACKEND_URL}/api/admin/users`, {
    headers: {'Authorization': `Bearer ${token}`}
  });
  document.getElementById('logsOutput').innerText = JSON.stringify(await res.json(), null, 2);
}

function logout() {
  localStorage.removeItem('token');
  token = null;
  checkAuth();
}

checkAuth();
</script>
</body>
</html>
